# RocketMQ Broker Configuration

# Broker基本信息
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0

# Nameserver地址
namesrvAddr=nameserver:9876

# Broker监听地址
listenPort=10911
listenPortSSL=
vipChannelEnabled=false

# 存储配置
storePathRootDir=/home/rocketmq/data
storePathCommitLog=/home/rocketmq/data/commitlog
storePathConsumeQueue=/home/rocketmq/data/consumequeue
storePathIndex=/home/rocketmq/data/index
storeCheckpoint=/home/rocketmq/data/checkpoint
abortFile=/home/rocketmq/data/abort

# 性能配置
flushDiskType=ASYNC_FLUSH
flushCommitLogLeastPages=4
flushConsumeQueueLeastPages=2
flushCommitLogThoroughInterval=10000
flushConsumeQueueThoroughInterval=60000

# 消息存储配置
maxMessageSize=4194304
messageIndexEnable=true
messageIndexSafe=false
maxIndexSlotNum=500000
maxIndexNum=2000000

# 消费者线程数
sendMessageThreadPoolNums=16
pullMessageThreadPoolNums=16

# 延迟消息配置
delayLevelEnable=true

# 事务消息配置
transactionCheckInterval=30000
transactionTimeOut=6000
transactionCheckMax=15

# 消费者负载均衡
consumerOffsetUpdateStrategy=PLANKING

# ACL配置 (如需开启取消注释)
# aclEnable=true
# plainAccessKey=rocketmq
# plainAccessSecret=12345678

# 其他配置
brokerRole=ASYNC_MASTER
waitTimeMillsInSendQueue=1000
